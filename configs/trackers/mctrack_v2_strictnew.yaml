# YOLOv11-MCTrack v2（严格新建轨迹阈值版）
# EXP-09i：隔离验证"遮挡恢复能力"本身是否有效，排除"轻易开新轨迹"带来的误检副作用
#
# 背景：EXP-09h 证实 mctrack.yaml 的 new_track_thresh=0.20（比 ByteTrack 默认 0.25 更宽松）
# 会让更多低置信度误检被当成新目标建立轨迹，虽然召回率提升（CLR_Re +1.5pp），
# 但引入的误检和碎片化（CLR_Pr -6.1pp，IDS/Frag 上升）完全抵消了收益，MOTA/HOTA/IDF1 全面变差。
#
# 本配置把 new_track_thresh 调回和 ByteTrack 默认一致（0.25），只保留：
#   - track_low_thresh=0.05（比 ByteTrack 默认 0.1 更低，扩大"挽救已有轨迹"的候选池）
#   - GMC 相机运动补偿、轻量 ReID、遮挡记忆扩大（track_buffer=60）、轨迹置信传播
# 目的：单独验证"用低置信度框挽救已有轨迹"这个机制本身是否有正向价值，
# 而不是像 09h 那样被"轻易开新轨迹"的副作用污染。

tracker_type: botsort

# ------------------------------------------------------------------
# 关键改动：new_track_thresh 与 ByteTrack 默认对齐（0.20 -> 0.25）
# 避免低置信度误检被直接当成新目标开轨迹；低置信度框只用于挽救已有轨迹
# ------------------------------------------------------------------
track_high_thresh: 0.15   # 主匹配阈值，同 mctrack.yaml
track_low_thresh:  0.05   # 二次匹配阈值（遮挡恢复），同 mctrack.yaml
new_track_thresh:  0.25   # 与 ByteTrack/BoT-SORT 默认一致，避免误检开新轨迹

# ------------------------------------------------------------------
# 遮挡记忆（同 mctrack.yaml）
# ------------------------------------------------------------------
track_buffer: 60

match_thresh: 0.85
fuse_score: True

# ------------------------------------------------------------------
# GMC 相机运动补偿（同 mctrack.yaml）
# ------------------------------------------------------------------
gmc_method: sparseOptFlow

# ------------------------------------------------------------------
# 轻量 ReID（同 mctrack.yaml）
# ------------------------------------------------------------------
proximity_thresh:  0.4
appearance_thresh: 0.75
with_reid: True
model: auto
