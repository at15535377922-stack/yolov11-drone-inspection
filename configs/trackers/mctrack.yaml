# YOLOv11-MCTrack 追踪器配置
# EXP-09c：针对无人机低空俯拍场景（VisDrone-MOT）优化
#
# 设计思路：
#   - 基于 BoT-SORT 框架，启用 GMC 相机运动补偿（sparseOptFlow）
#   - 开启 ReID 外观特征，降低遮挡/交叉场景的 ID Switch
#   - 降低双阈值（track_high_thresh / track_low_thresh）提升小目标 pedestrian 召回
#   - 扩大 track_buffer 提升遮挡容忍，减少 Fragmentation
#   - 收紧 new_track_thresh 减少短暂 FP 产生的新轨迹噪声
#
# 对应论文创新点：
#   1. 相机运动补偿（GMC-sparseOptFlow）：补偿无人机飞行引入的帧间位移偏差
#   2. 双阈值关联：track_high_thresh=0.15 / track_low_thresh=0.05 捕捉低置信度小目标
#   3. 轻量 ReID（with_reid=True, model=auto）：利用检测器自身特征嵌入，零额外参数
#   4. 轨迹置信传播：fuse_score=True，融合检测置信度与轨迹运动一致性
#   5. 遮挡记忆（track_buffer=60）：短时消失目标保留 60 帧，减少轨迹碎片化

tracker_type: botsort

# ------------------------------------------------------------------
# 双阈值关联（创新点2）
# 相比 BoT-SORT 默认值降低，提升 VisDrone 小目标行人的检测召回
# ------------------------------------------------------------------
track_high_thresh: 0.15   # 主匹配阈值（默认0.25→0.15，捕捉更多小目标）
track_low_thresh:  0.05   # 二次匹配阈值（默认0.10→0.05，遮挡恢复）
new_track_thresh:  0.20   # 新轨迹启动阈值（默认0.25→0.20，稍宽松）

# ------------------------------------------------------------------
# 遮挡记忆（创新点5）
# ------------------------------------------------------------------
track_buffer: 60          # 默认30→60，无人机场景目标可被遮挡较长时间

# ------------------------------------------------------------------
# 关联相似度阈值
# ------------------------------------------------------------------
match_thresh: 0.85        # 稍高于默认0.80，结合 ReID 后可更严格匹配

# 轨迹置信传播（创新点4）
fuse_score: True          # 融合检测置信度与 IoU 距离

# ------------------------------------------------------------------
# GMC 相机运动补偿（创新点1）
# ------------------------------------------------------------------
gmc_method: sparseOptFlow # 稀疏光流，速度/精度平衡最优，适合无人机运动

# ------------------------------------------------------------------
# 轻量 ReID（创新点3）
# with_reid=True + model=auto：使用检测器骨干自带特征嵌入，零额外参数
# ------------------------------------------------------------------
proximity_thresh:  0.4    # 默认0.5→0.4，小目标 IoU 本身偏低，适当放宽
appearance_thresh: 0.75   # 默认0.8→0.75，对外观相似度要求稍宽
with_reid: True           # 开启外观 ReID
model: auto               # 使用 ASE-YOLOv11 检测器骨干特征，无需额外模型
