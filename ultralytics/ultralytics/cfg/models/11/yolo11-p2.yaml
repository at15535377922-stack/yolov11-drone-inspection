# ASE-YOLOv11 EXP-02: YOLOv11 with P2/4 small-object detection branch
# Based on yolo11.yaml, head extended to output P2/P3/P4/P5 (four detection heads)
#
# Changes vs yolo11.yaml:
#   - Head layers 17-21 added: upsample P3 → concat F2 → C3k2 → P2 feature
#   - P2 down-sample back to P3 scale (bidirectional path, per thesis §6.3)
#   - Detect now takes [P2, P3, P4, P5] = 4 heads instead of 3
#
# Backbone is unchanged (no Python modification needed).
# All scales (n/s/m/l/x) are inherited from yolo11.yaml compound scaling.

nc: 80  # number of classes (overridden by dataset yaml at runtime)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00,  512]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

# YOLOv11 backbone (identical to yolo11.yaml)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64,   3, 2]]  # 0  P1/2
  - [-1, 1, Conv,  [128,  3, 2]]  # 1  P2/4   ← F2: high-res shallow feature
  - [-1, 2, C3k2,  [256,  False, 0.25]]  # 2  F2 feature (stride=4)
  - [-1, 1, Conv,  [256,  3, 2]]  # 3  P3/8
  - [-1, 2, C3k2,  [512,  False, 0.25]]  # 4  F3 feature (stride=8)
  - [-1, 1, Conv,  [512,  3, 2]]  # 5  P4/16
  - [-1, 2, C3k2,  [512,  True]]  # 6  F4 feature (stride=16)
  - [-1, 1, Conv,  [1024, 3, 2]]  # 7  P5/32
  - [-1, 2, C3k2,  [1024, True]]  # 8
  - [-1, 1, SPPF,  [1024, 5]]     # 9
  - [-1, 2, C2PSA, [1024]]        # 10 F5 feature (stride=32, deepest semantic)

# YOLOv11 head with P2 branch (bidirectional FPN+PAN, §6.3)
head:
  # ── Top-down FPN path (P5 → P4 → P3 → P2) ──────────────────────────────
  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 11  F5 ×2 upsample
  - [[-1, 6], 1, Concat,      [1]]                   # 12  cat backbone F4
  - [-1,      2, C3k2,        [512, False]]           # 13  P4/16 neck feature

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 14  P4 ×2 upsample
  - [[-1, 4], 1, Concat,      [1]]                   # 15  cat backbone F3
  - [-1,      2, C3k2,        [256, False]]           # 16  P3/8 neck feature

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 17  P3 ×2 upsample → P2 scale
  - [[-1, 2], 1, Concat,      [1]]                   # 18  cat backbone F2 (stride=4)
  - [-1,      2, C3k2,        [128, False]]           # 19  P2/4 feature  ← NEW HEAD INPUT

  # ── Bottom-up PAN path (P2 → P3 → P4 → P5) ─────────────────────────────
  - [-1,       1, Conv,  [128, 3, 2]]                 # 20  P2 ×2 downsample → P3 scale
  - [[-1, 16], 1, Concat, [1]]                        # 21  cat P3 neck feature (bidirectional)
  - [-1,       2, C3k2,   [256, False]]               # 22  P3/8  ← NEW HEAD INPUT

  - [-1,       1, Conv,  [256, 3, 2]]                 # 23  P3 ×2 downsample → P4 scale
  - [[-1, 13], 1, Concat, [1]]                        # 24  cat P4 neck feature
  - [-1,       2, C3k2,   [512, False]]               # 25  P4/16 ← HEAD INPUT

  - [-1,       1, Conv,  [512, 3, 2]]                 # 26  P4 ×2 downsample → P5 scale
  - [[-1, 10], 1, Concat, [1]]                        # 27  cat F5 (backbone deepest)
  - [-1,       2, C3k2,   [1024, True]]               # 28  P5/32 ← HEAD INPUT

  # ── Detection heads: P2 / P3 / P4 / P5 ─────────────────────────────────
  - [[19, 22, 25, 28], 1, Detect, [nc]]               # 29  Detect(P2, P3, P4, P5)
