#
# ASE-YOLOv11 EXP-04: YOLOv11-P2 with lightweight weighted fusion + CBAM attention
# Based on yolo11-p2-lwf.yaml.
#
# Key change:
#   - Keep the EXP-03 P2 + LWFusion neck unchanged.
#   - Insert lightweight channel-spatial attention (CBAM) before each Detect input.
#   - Focus on improving small-object response under complex UAV backgrounds.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64,   3, 2]]
  - [-1, 1, Conv,  [128,  3, 2]]
  - [-1, 2, C3k2,  [256,  False, 0.25]]
  - [-1, 1, Conv,  [256,  3, 2]]
  - [-1, 2, C3k2,  [512,  False, 0.25]]
  - [-1, 1, Conv,  [512,  3, 2]]
  - [-1, 2, C3k2,  [512,  True]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 2, C3k2,  [1024, True]]
  - [-1, 1, SPPF,  [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, LWFusion,    [512]]                  # 12 weighted fuse P5↑ + F4
  - [-1,      2, C3k2,        [512, False]]           # 13

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, LWFusion,    [256]]                  # 15 weighted fuse P4↑ + F3
  - [-1,      2, C3k2,        [256, False]]           # 16

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, LWFusion,    [128]]                  # 18 weighted fuse P3↑ + F2
  - [-1,      2, C3k2,        [128, False]]           # 19 P2/4

  - [-1,       1, Conv,       [128, 3, 2]]            # 20
  - [[-1, 16], 1, LWFusion,   [256]]                  # 21 weighted fuse P2↓ + P3
  - [-1,       2, C3k2,       [256, False]]           # 22 P3/8

  - [-1,       1, Conv,       [256, 3, 2]]            # 23
  - [[-1, 13], 1, LWFusion,   [512]]                  # 24 weighted fuse P3↓ + P4
  - [-1,       2, C3k2,       [512, False]]           # 25 P4/16

  - [-1,       1, Conv,       [512, 3, 2]]            # 26
  - [[-1, 10], 1, LWFusion,   [1024]]                 # 27 weighted fuse P4↓ + F5
  - [-1,       2, C3k2,       [1024, True]]           # 28 P5/32

  - [19, 1, CBAM, [7]]                                # 29 attention on P2
  - [22, 1, CBAM, [7]]                                # 30 attention on P3
  - [25, 1, CBAM, [7]]                                # 31 attention on P4
  - [28, 1, CBAM, [7]]                                # 32 attention on P5

  - [[29, 30, 31, 32], 1, Detect, [nc]]               # 33 Detect(P2, P3, P4, P5)
