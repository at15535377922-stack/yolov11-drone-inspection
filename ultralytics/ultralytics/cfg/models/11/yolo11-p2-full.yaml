#
# ASE-YOLOv11 EXP-07: Full integration — P2 + LWFusion + CBAM + TADetect + NWD loss
#
# Module stack (relative to EXP-04 yolo11-p2-lwf-cbam.yaml):
#   - Backbone        : unchanged (YOLOv11n)
#   - Neck            : LWFusion at all 6 fusion nodes (same as EXP-03/04)
#   - Pre-detect attn : CBAM on P2/P3/P4/P5 (same as EXP-04)
#   - Detection head  : TADetect with ta_layers=2 (P2+P3 bidirectional cls/reg interaction)
#   - Loss            : CIoU + NWD (nwd_weight=0.4), controlled via CLI hyp (same as EXP-05/06)
#
# Layer index reference (after CBAM):
#   P2 → layer 29 (CBAM output, 1/4 stride)
#   P3 → layer 30 (CBAM output, 1/8 stride)
#   P4 → layer 31 (CBAM output, 1/16 stride)
#   P5 → layer 32 (CBAM output, 1/32 stride)
#
# TADetect args: [nc, reg_max=16, ta_layers=2]
#   ta_layers=2 → apply bidirectional interaction only on P2 (index 0) and P3 (index 1)
#   P4, P5 run the standard Detect forward path unchanged

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64,   3, 2]]   # 0  P1/2
  - [-1, 1, Conv,  [128,  3, 2]]   # 1  P2/4  (F1)
  - [-1, 2, C3k2,  [256,  False, 0.25]]  # 2  F2
  - [-1, 1, Conv,  [256,  3, 2]]   # 3
  - [-1, 2, C3k2,  [512,  False, 0.25]]  # 4  F3
  - [-1, 1, Conv,  [512,  3, 2]]   # 5
  - [-1, 2, C3k2,  [512,  True]]   # 6  F4
  - [-1, 1, Conv,  [1024, 3, 2]]   # 7
  - [-1, 2, C3k2,  [1024, True]]   # 8
  - [-1, 1, SPPF,  [1024, 5]]      # 9
  - [-1, 2, C2PSA, [1024]]         # 10 F5

head:
  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, LWFusion,    [512]]                  # 12  weighted fuse P5↑ + F4
  - [-1,      2, C3k2,        [512, False]]           # 13

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, LWFusion,    [256]]                  # 15  weighted fuse P4↑ + F3
  - [-1,      2, C3k2,        [256, False]]           # 16

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, LWFusion,    [128]]                  # 18  weighted fuse P3↑ + F2
  - [-1,      2, C3k2,        [128, False]]           # 19  P2/4

  - [-1,       1, Conv,       [128, 3, 2]]            # 20
  - [[-1, 16], 1, LWFusion,   [256]]                  # 21  weighted fuse P2↓ + P3
  - [-1,       2, C3k2,       [256, False]]           # 22  P3/8

  - [-1,       1, Conv,       [256, 3, 2]]            # 23
  - [[-1, 13], 1, LWFusion,   [512]]                  # 24  weighted fuse P3↓ + P4
  - [-1,       2, C3k2,       [512, False]]           # 25  P4/16

  - [-1,       1, Conv,       [512, 3, 2]]            # 26
  - [[-1, 10], 1, LWFusion,   [1024]]                 # 27  weighted fuse P4↓ + F5
  - [-1,       2, C3k2,       [1024, True]]           # 28  P5/32

  - [19, 1, CBAM, [7]]                                # 29  attention on P2
  - [22, 1, CBAM, [7]]                                # 30  attention on P3
  - [25, 1, CBAM, [7]]                                # 31  attention on P4
  - [28, 1, CBAM, [7]]                                # 32  attention on P5

  - [[29, 30, 31, 32], 1, TADetect, [nc, 16, 2]]      # 33  TADetect(P2,P3,P4,P5) ta_layers=2
