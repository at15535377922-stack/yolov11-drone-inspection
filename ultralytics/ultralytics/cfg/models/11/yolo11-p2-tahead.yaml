#
# ASE-YOLOv11 EXP-06: P2 branch + Task-Aligned Detection Head (TADetect)
# Base  : yolo11-p2.yaml  (EXP-02, identical backbone + neck)
# Change: Detect → TADetect with ta_layers=2
#           → P2 and P3 heads get lightweight bidirectional cls/reg interaction
#           → P4 and P5 heads run standard Detect forward path unchanged
# Loss  : NWD combined loss is kept (same hyp as EXP-05, passed via CLI)
#
# §6.6: F_cls' = F_cls ⊗ S(F_reg)   (regression guides classification via spatial attn)
#        F_reg' = F_reg ⊗ C(F_cls)   (classification guides regression via channel attn)

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00,  512]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

# Backbone (unchanged from yolo11-p2.yaml)
backbone:
  - [-1, 1, Conv,  [64,   3, 2]]  # 0  P1/2
  - [-1, 1, Conv,  [128,  3, 2]]  # 1  P2/4
  - [-1, 2, C3k2,  [256,  False, 0.25]]  # 2  F2 (stride=4)
  - [-1, 1, Conv,  [256,  3, 2]]  # 3  P3/8
  - [-1, 2, C3k2,  [512,  False, 0.25]]  # 4  F3 (stride=8)
  - [-1, 1, Conv,  [512,  3, 2]]  # 5  P4/16
  - [-1, 2, C3k2,  [512,  True]]  # 6  F4 (stride=16)
  - [-1, 1, Conv,  [1024, 3, 2]]  # 7  P5/32
  - [-1, 2, C3k2,  [1024, True]]  # 8
  - [-1, 1, SPPF,  [1024, 5]]     # 9
  - [-1, 2, C2PSA, [1024]]        # 10 F5 (stride=32)

# Head (neck unchanged; only Detect → TADetect at the end)
head:
  # ── Top-down FPN ──────────────────────────────────────────────────────────
  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat,      [1]]                   # 12
  - [-1,      2, C3k2,        [512, False]]           # 13  P4/16

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat,      [1]]                   # 15
  - [-1,      2, C3k2,        [256, False]]           # 16  P3/8

  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, Concat,      [1]]                   # 18
  - [-1,      2, C3k2,        [128, False]]           # 19  P2/4

  # ── Bottom-up PAN ─────────────────────────────────────────────────────────
  - [-1,       1, Conv,   [128, 3, 2]]                # 20
  - [[-1, 16], 1, Concat, [1]]                        # 21
  - [-1,       2, C3k2,   [256, False]]               # 22  P3/8

  - [-1,       1, Conv,   [256, 3, 2]]                # 23
  - [[-1, 13], 1, Concat, [1]]                        # 24
  - [-1,       2, C3k2,   [512, False]]               # 25  P4/16

  - [-1,       1, Conv,   [512, 3, 2]]                # 26
  - [[-1, 10], 1, Concat, [1]]                        # 27
  - [-1,       2, C3k2,   [1024, True]]               # 28  P5/32

  # ── Detection: TADetect on P2/P3 (ta_layers=2), standard on P4/P5 ────────
  # args: [nc, ta_layers]  — reg_max defaults to 16 inside TADetect.__init__
  - [[19, 22, 25, 28], 1, TADetect, [nc, 16, 2]]      # 29  TADetect(P2, P3, P4, P5)
